<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="小金加油">
  <meta name="theme-color" content="#FFE4EC">
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icon-180.png" sizes="180x180">
  <link rel="apple-touch-icon" href="icon-192.png" sizes="192x192">
  <title>小金加油</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="app">
    <!-- 顶部标题栏 -->
    <header class="app-header">
      <div class="header-title">
        <span class="header-emoji">🌸</span>
        <span>小金加油</span>
      </div>
      <div class="header-date" id="headerDate"></div>
      <button class="header-settings" id="headerSettings">⚙️</button>
    </header>

    <!-- 主内容区 -->
    <main class="app-main" id="appMain">
      <!-- 内容由 JS 动态渲染 -->
    </main>

    <!-- 底部导航 -->
    <nav class="tab-bar" id="tabBar">
      <button class="tab-item active" data-tab="diary">
        <span class="tab-icon">📔</span>
        <span class="tab-label">日程手帐</span>
      </button>
      <button class="tab-item" data-tab="media">
        <span class="tab-icon">📱</span>
        <span class="tab-label">自媒体运营</span>
      </button>
      <button class="tab-item" data-tab="pets">
        <span class="tab-icon">🐾</span>
        <span class="tab-label">养宠日记</span>
      </button>
      <button class="tab-item" data-tab="craft">
        <span class="tab-icon">✂️</span>
        <span class="tab-label">手作专区</span>
      </button>
      <button class="tab-item" data-tab="growth">
        <span class="tab-icon">🌱</span>
        <span class="tab-label">个人成长</span>
      </button>
    </nav>
  </div>

  <!-- 弹窗容器 -->
  <div class="modal-mask" id="modalMask"></div>
  <div class="modal-wrap" id="modalWrap"></div>

  <!-- toast 容器 -->

  <script src="store.js"></script>
  <script src="components.js"></script>
  <script src="diary.js"></script>
  <script src="media.js"></script>
  <script src="pets.js"></script>
  <script src="craft.js"></script>
  <script src="growth.js"></script>
  <script src="app.js"></script>
  <script>
    // 注册 Service Worker：让网页添加到主屏幕后能离线打开，
    // 即使服务器临时掉线，已缓存的页面仍能正常进入并使用。
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function () {
        navigator.serviceWorker.register('./sw.js').then(function (reg) {
          // 检测到新版本 Service Worker：自动刷新以应用最新页面（新功能/新图标）
          if (reg && reg.addEventListener) {
            reg.addEventListener('updatefound', function () {
              var nw = reg.installing;
              if (!nw) return;
              nw.addEventListener('statechange', function () {
                if (nw.state === 'installed' && navigator.serviceWorker.controller) {
                  window.location.reload();
                }
              });
            });
          }
        }).catch(function () {});
      });
    }
  </script>
</body>
</html>
